<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06050b" />
<meta name="description" content="Dark Abyss — SMP | RPG Minecraft server. Join on Java or Bedrock." />
<title>Dark Abyss — SMP | RPG Server</title>
<style>
:root{
  --bg:#05040a;--ink:#f7f4ff;--muted:#a8a0b7;--purple:#a855f7;--purple2:#6d28d9;
  --cyan:#22d3ee;--cyan2:#0891b2;--line:rgba(199,166,255,.20);--panel:rgba(8,7,15,.72);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit}
.page{position:relative;min-height:100svh;isolation:isolate;background:#05040a;overflow:hidden}
.world{position:absolute;z-index:-4;inset:0 0 0 39%;background:url('/assets/hero-world.webp') center/cover no-repeat;filter:saturate(1.12) contrast(1.04)}
.page:before{content:"";position:absolute;z-index:-3;inset:0;background:
  radial-gradient(circle at 76% 16%,rgba(126,34,206,.20),transparent 28%),
  linear-gradient(90deg,#05040a 0%,#05040a 31%,rgba(5,4,10,.94) 44%,rgba(5,4,10,.42) 68%,rgba(5,4,10,.18) 100%)}
.page:after{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.02) 64%,#05040a 100%);pointer-events:none}
.shell{width:min(1500px,calc(100% - 56px));margin:auto}
.nav-wrap{height:106px;border-bottom:1px solid rgba(176,125,255,.14);background:linear-gradient(180deg,rgba(3,3,8,.92),rgba(4,4,10,.68));backdrop-filter:blur(12px)}
.nav{height:100%;display:flex;align-items:center;gap:44px}
.logo{display:flex;align-items:center;margin-right:20px}.logo img{display:block;width:78px;height:68px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(147,51,234,.40))}
.links{display:flex;align-items:center;height:100%;gap:0}
.nav-link{height:56px;padding:0 27px;display:flex;align-items:center;gap:11px;border-left:1px solid rgba(255,255,255,.10);font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.035em;text-transform:uppercase;color:#efeafd;transition:.2s}
.nav-link:first-child{border-left:0}.nav-link:hover{color:white;text-shadow:0 0 16px rgba(168,85,247,.75);transform:translateY(-1px)}
.nav-icon{font-family:system-ui;color:var(--purple);font-size:20px;text-shadow:0 0 15px rgba(168,85,247,.75)}
.hero{min-height:calc(100svh - 106px);display:flex;align-items:center;padding:48px 0 60px}
.content{width:min(700px,52vw);padding-bottom:12px}
.eyebrow{color:#bba7d6;font-family:Georgia,"Times New Roman",serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin-bottom:6px}
.title{margin:0;line-height:.76;font-family:Georgia,"Times New Roman",serif;font-weight:900;letter-spacing:-.065em;text-transform:uppercase;font-size:clamp(82px,9.4vw,154px)}
.title .dark{display:block;background:linear-gradient(180deg,#d8b4fe 0%,#8b5cf6 50%,#4c1d95 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(232,211,255,.16);text-shadow:0 16px 38px rgba(93,31,173,.28)}
.title .abyss{display:block;background:linear-gradient(180deg,#d9f8ff 0%,#73e4ff 35%,#22a9db 66%,#075985 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(189,240,255,.18);filter:drop-shadow(0 12px 26px rgba(6,182,212,.18))}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0 13px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(168,85,247,.65),rgba(34,211,238,.28),transparent)}.gem{width:10px;height:10px;transform:rotate(45deg);border:1px solid #a855f7;box-shadow:0 0 12px rgba(168,85,247,.7)}
.sub{font-family:Georgia,"Times New Roman",serif;text-align:center;color:#c7bfd1;font-size:clamp(18px,2vw,30px);letter-spacing:.06em;text-transform:uppercase;margin:0 0 28px;text-shadow:0 2px 10px #000}
.server-list{display:grid;gap:15px}.server{position:relative;display:grid;grid-template-columns:58px auto 1fr 34px;align-items:center;min-height:88px;padding:0 18px;border-radius:4px;background:linear-gradient(90deg,rgba(15,9,25,.94),rgba(10,9,18,.82));overflow:hidden;cursor:pointer;transition:transform .16s,filter .16s;box-shadow:0 18px 45px rgba(0,0,0,.25)}
.server:before{content:"";position:absolute;inset:0;border:1px solid currentColor;opacity:.58;pointer-events:none}.server:after{content:"";position:absolute;inset:5px;border:1px solid currentColor;opacity:.16;pointer-events:none}.server:hover{transform:translateX(4px);filter:brightness(1.12)}.server.java{color:#a855f7}.server.bedrock{color:#22d3ee}.cube{width:42px;height:42px;display:grid;place-items:center;border:1px solid currentColor;background:rgba(255,255,255,.035);font-size:22px;box-shadow:0 0 24px color-mix(in srgb,currentColor 28%,transparent)}
.edition{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:22px;letter-spacing:.03em;margin-right:15px}.ip{color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(17px,1.65vw,25px);white-space:nowrap}.arrow{font-size:38px;font-weight:300;line-height:1;text-shadow:0 0 17px currentColor}
.hint{margin-top:13px;color:#8e8799;font-size:12px;text-align:center;letter-spacing:.02em}.hint strong{color:#c7bfd1}
.toast{position:fixed;z-index:99;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,22px);padding:12px 16px;border:1px solid rgba(168,85,247,.42);background:rgba(13,9,21,.94);box-shadow:0 14px 40px rgba(0,0,0,.42);color:#fff;opacity:0;pointer-events:none;transition:.2s;border-radius:9px;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-nav{display:none}
@media(max-width:980px){
  .shell{width:min(100% - 28px,1500px)}.nav-wrap{height:82px}.nav{gap:8px;justify-content:space-between}.logo img{width:58px;height:54px}.links{gap:0;overflow:auto}.nav-link{padding:0 15px;height:48px;font-size:12px}.nav-icon{font-size:15px}
  .hero{min-height:calc(100svh - 82px);align-items:flex-end;padding:34px 0 38px}.world{inset:0 0 28% 17%;opacity:.94}.page:before{background:linear-gradient(180deg,rgba(5,4,10,.20),rgba(5,4,10,.58) 43%,#05040a 72%),linear-gradient(90deg,#05040a 0%,rgba(5,4,10,.30) 55%,rgba(5,4,10,.12))}.content{width:100%;max-width:690px}.title{font-size:clamp(72px,18vw,120px)}.sub{text-align:left;margin-left:2px;font-size:18px}.divider{max-width:500px}.server{grid-template-columns:48px auto 1fr 26px;min-height:74px;padding:0 13px}.cube{width:36px;height:36px;font-size:18px}.edition{font-size:17px}.ip{font-size:16px}.arrow{font-size:28px}.hint{text-align:left;padding-left:4px}
}
@media(max-width:620px){
  .nav-wrap{height:auto;padding-top:env(safe-area-inset-top)}.nav{height:70px}.logo{margin-right:0}.logo img{width:53px;height:47px}.links{display:none}.mobile-nav{display:flex;gap:7px}.mobile-nav a,.mobile-nav button{border:1px solid rgba(168,85,247,.25);background:rgba(14,10,22,.7);color:#eee6fb;padding:9px 10px;border-radius:8px;font-size:11px}.hero{min-height:calc(100svh - 70px);padding-bottom:max(24px,env(safe-area-inset-bottom))}.world{inset:0 -15% 43% 4%;background-position:57% 50%;opacity:.93}.page:before{background:linear-gradient(180deg,rgba(5,4,10,.10),rgba(5,4,10,.23) 28%,rgba(5,4,10,.92) 55%,#05040a 73%)}.content{padding-top:44vh}.eyebrow{display:none}.title{font-size:clamp(62px,22vw,96px);line-height:.78}.divider{margin:19px 0 10px;max-width:390px}.sub{font-size:16px;margin-bottom:20px}.server-list{gap:10px}.server{grid-template-columns:42px 1fr 23px;grid-template-areas:"cube label arrow" "cube ip arrow";min-height:76px;padding:9px 11px}.cube{grid-area:cube;width:34px;height:34px}.edition{grid-area:label;font-size:14px;align-self:end}.ip{grid-area:ip;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;align-self:start;white-space:normal}.arrow{grid-area:arrow}.hint{font-size:10px}
}
</style>
</head>
<body>
<div class="page">
  <div class="world" aria-hidden="true"></div>
  <header class="nav-wrap">
    <nav class="shell nav" aria-label="Main navigation">
      <a class="logo" href="/" aria-label="Dark Abyss home"><img src="/assets/abyss-crest.webp" alt="Dark Abyss" /></a>
      <div class="links">
        <a class="nav-link" href="/rules/"><span class="nav-icon">▣</span>Rules</a>
        <a class="nav-link" href="/commands/"><span class="nav-icon">▤</span>Guide</a>
        <a class="nav-link pending" href="#" data-page="Store"><span class="nav-icon">▰</span>Store</a>
        <a class="nav-link" href="https://discord.gg/Sfk5K3jat" target="_blank" rel="noopener noreferrer"><span class="nav-icon">●</span>Discord</a>
      </div>
      <div class="mobile-nav">
        <a href="/rules/">Rules</a><a href="/commands/">Guide</a><a href="https://discord.gg/Sfk5K3jat" target="_blank" rel="noopener noreferrer">Discord</a>
      </div>
    </nav>
  </header>

  <main class="shell hero">
    <section class="content" aria-labelledby="hero-title">
      <p class="eyebrow">Enter the Abyss</p>
      <h1 class="title" id="hero-title"><span class="dark">Dark</span><span class="abyss">Abyss</span></h1>
      <div class="divider"><span class="gem"></span></div>
      <p class="sub">SMP | RPG Server</p>

      <div class="server-list">
        <button class="server java" type="button" id="javaButton" aria-label="Copy Java server address">
          <span class="cube">◆</span><span class="edition">JAVA:</span><span class="ip">play.darkabyssmc.com</span><span class="arrow">›</span>
        </button>
        <a class="server bedrock" id="bedrockButton" href="minecraft://?addExternalServer=Dark%20Abyss|play.darkabyssmc.com:25565" aria-label="Open Dark Abyss in Minecraft Bedrock">
          <span class="cube">◇</span><span class="edition">BEDROCK:</span><span class="ip">play.darkabyssmc.com : 25565</span><span class="arrow">›</span>
        </a>
      </div>
      <p class="hint"><strong>Java:</strong> tap to copy IP &nbsp;•&nbsp; <strong>Bedrock:</strong> opens Minecraft when supported and copies the address.</p>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const JAVA_IP='play.darkabyssmc.com';
const BEDROCK_IP='play.darkabyssmc.com:25565';
const toast=document.getElementById('toast');
let toastTimer;
function notify(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
async function copy(value,message){try{await navigator.clipboard.writeText(value);notify(message)}catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify(message)}}
document.getElementById('javaButton').addEventListener('click',()=>copy(JAVA_IP,'Java IP copied — paste it in Multiplayer'));
document.getElementById('bedrockButton').addEventListener('click',()=>copy(BEDROCK_IP,'Bedrock address copied — opening Minecraft…'));
document.querySelectorAll('.pending').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();notify((el.dataset.page||'This page')+' is coming next')}));
</script>
</body>
</html>
