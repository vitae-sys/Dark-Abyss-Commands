<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#05040a" />
<meta name="description" content="Dark Abyss — SMP | RPG Minecraft server. Java and Bedrock." />
<title>Dark Abyss — SMP | RPG Server</title>
<style>
:root{--bg:#05040a;--ink:#f7f4ff;--muted:#9990a7;--purple:#a855f7;--cyan:#22d3ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.shell{width:min(1380px,calc(100% - 44px));margin:auto}
.topbar{position:relative;z-index:20;height:94px;border-bottom:1px solid rgba(176,125,255,.15);background:linear-gradient(180deg,rgba(3,3,8,.94),rgba(5,4,11,.72));backdrop-filter:blur(14px)}
.nav{height:100%;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:15px;margin-right:auto}.rune{position:relative;width:58px;height:58px;flex:0 0 58px;filter:drop-shadow(0 0 12px rgba(168,85,247,.38))}.rune:before{content:"";position:absolute;inset:11px;transform:rotate(45deg);border:2px solid #a855f7;background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(34,211,238,.08));box-shadow:0 0 0 1px rgba(34,211,238,.18) inset,0 0 20px rgba(168,85,247,.22)}.rune:after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);background:linear-gradient(135deg,#d8b4fe,#22d3ee);box-shadow:0 0 16px rgba(168,85,247,.9),0 0 26px rgba(34,211,238,.35)}
.brand-copy strong{display:block;font-family:Georgia,"Times New Roman",serif;letter-spacing:.16em;text-transform:uppercase;font-size:15px}.brand-copy span{display:block;margin-top:4px;color:#8f879b;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.links{display:flex;align-items:center;gap:5px}.links a{padding:11px 14px;border:1px solid transparent;border-radius:12px;font-family:Georgia,"Times New Roman",serif;font-size:13px;font-weight:700;letter-spacing:.035em;text-transform:uppercase;color:#eee8fa;transition:.18s}.links a:hover,.links a.active{background:rgba(255,255,255,.04);border-color:rgba(179,125,255,.21);text-shadow:0 0 15px rgba(168,85,247,.68)}.nav-icon{color:#b978ff;margin-right:7px}.menu-toggle{display:none;border:1px solid rgba(168,85,247,.25);background:rgba(16,11,25,.8);color:#f4edff;width:46px;height:46px;border-radius:13px;font-size:20px}
.toast{position:fixed;z-index:100;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:11px 15px;border-radius:11px;border:1px solid rgba(168,85,247,.4);background:rgba(13,9,21,.96);box-shadow:0 18px 42px rgba(0,0,0,.4);color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.page{position:relative;min-height:100svh;overflow:hidden;background:#05040a}
.art{position:absolute;z-index:1;top:94px;right:0;bottom:0;width:66%;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 70% 34%,rgba(124,58,237,.18),transparent 35%),#05040a}
.art svg{display:block;width:100%;height:100%}.art:before{content:"";position:absolute;z-index:4;inset:0;background:linear-gradient(90deg,#05040a 0%,rgba(5,4,10,.94) 9%,rgba(5,4,10,.48) 34%,rgba(5,4,10,.06) 64%),linear-gradient(180deg,transparent 0 70%,#05040a 100%)}
.portal-core{animation:pulse 3.8s ease-in-out infinite}.spark{animation:twinkle 2.8s ease-in-out infinite}.spark:nth-child(2n){animation-delay:-1.2s}.spark:nth-child(3n){animation-delay:-2s}.float-a{animation:floatA 7s ease-in-out infinite}.float-b{animation:floatB 9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.76}50%{opacity:1}}@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:.92}}@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.hero{position:relative;z-index:4;min-height:calc(100svh - 94px);display:flex;align-items:center;padding:46px 0 56px}.content{width:min(690px,52vw)}.eyebrow{font-family:Georgia,"Times New Roman",serif;color:#b7a8ca;letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:7px}.title{margin:0;font-family:Georgia,"Times New Roman",serif;line-height:.76;font-weight:900;letter-spacing:-.06em;text-transform:uppercase;font-size:clamp(82px,9.4vw,154px)}.dark{display:block;background:linear-gradient(180deg,#d9b7ff,#945ef7 52%,#4b1f8e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 14px 28px rgba(92,31,171,.24))}.abyss{display:block;background:linear-gradient(180deg,#d9f8ff,#72e4ff 35%,#21a9d8 66%,#075985);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 12px 24px rgba(6,182,212,.18))}.divider{display:flex;align-items:center;gap:12px;margin:25px 0 12px;max-width:620px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(168,85,247,.66),rgba(34,211,238,.26),transparent)}.gem{width:10px;height:10px;transform:rotate(45deg);border:1px solid #a855f7;box-shadow:0 0 13px rgba(168,85,247,.75)}.sub{font-family:Georgia,"Times New Roman",serif;text-align:center;color:#cac1d4;font-size:clamp(18px,2vw,30px);letter-spacing:.065em;text-transform:uppercase;margin:0 0 28px}
.servers{display:grid;gap:14px}.server{position:relative;display:grid;grid-template-columns:54px auto 1fr 32px;align-items:center;min-height:86px;padding:0 18px;border:0;border-radius:5px;background:linear-gradient(90deg,rgba(15,9,25,.95),rgba(10,9,18,.84));cursor:pointer;overflow:hidden;text-align:left;box-shadow:0 20px 46px rgba(0,0,0,.27);transition:.16s}.server:before{content:"";position:absolute;inset:0;border:1px solid currentColor;opacity:.6}.server:after{content:"";position:absolute;inset:5px;border:1px solid currentColor;opacity:.15}.server:hover{transform:translateX(4px);filter:brightness(1.12)}.java{color:#a855f7}.bedrock{color:#22d3ee}.cube{width:40px;height:40px;display:grid;place-items:center;border:1px solid currentColor;background:rgba(255,255,255,.035);font-size:20px}.edition{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:21px;margin-right:14px}.ip{color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(17px,1.6vw,25px);white-space:nowrap}.arrow{font-size:37px;line-height:1;text-align:right}.hint{margin:13px 0 0;color:#8f879a;text-align:center;font-size:12px}.hint strong{color:#c7bfd1}
@media(max-width:980px){.content{width:min(660px,64vw)}.art{width:72%}}
@media(max-width:760px){.shell{width:min(100% - 24px,1380px)}.topbar{height:78px}.brand-copy{display:none}.rune{width:50px;height:50px;flex-basis:50px}.nav{gap:10px}.menu-toggle{display:block;margin-left:auto}.links{display:none;position:absolute;left:12px;right:12px;top:70px;padding:10px;border:1px solid rgba(168,85,247,.18);border-radius:16px;background:rgba(7,5,12,.97);box-shadow:0 20px 44px rgba(0,0,0,.42);flex-direction:column;align-items:stretch}.links.open{display:flex}.links a{width:100%;padding:13px 14px;background:rgba(255,255,255,.025)}.page{min-height:100svh}.art{top:78px;left:0;right:0;bottom:auto;width:100%;height:46svh;z-index:1}.art svg{width:132%;height:100%;transform:translateX(-19%)}.art:before{background:linear-gradient(180deg,rgba(5,4,10,0) 0%,rgba(5,4,10,.02) 40%,rgba(5,4,10,.52) 70%,#05040a 100%)}.hero{min-height:auto;display:block;padding:0 0 max(28px,env(safe-area-inset-bottom))}.content{width:100%;padding-top:41svh}.eyebrow{display:none}.title{font-size:clamp(62px,22vw,96px);line-height:.78}.divider{margin:18px 0 10px;max-width:390px}.sub{text-align:left;font-size:16px;margin-bottom:19px}.server{grid-template-columns:42px 1fr 24px;grid-template-areas:"cube edition arrow" "cube ip arrow";min-height:76px;padding:9px 12px}.cube{grid-area:cube;width:34px;height:34px}.edition{grid-area:edition;font-size:14px;align-self:end}.ip{grid-area:ip;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:normal;align-self:start}.arrow{grid-area:arrow;font-size:28px}.hint{text-align:left;font-size:10px;padding-left:3px}}
@media(prefers-reduced-motion:reduce){.portal-core,.spark,.float-a,.float-b{animation:none}}
</style>
</head>
<body>
<div class="page">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark fantasy block world with a glowing abyss portal">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090717"/><stop offset=".55" stop-color="#0a0a18"/><stop offset="1" stop-color="#05040a"/></linearGradient>
        <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".95"/><stop offset=".28" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".66" stop-color="#5b21b6" stop-opacity=".44"/><stop offset="1" stop-color="#090717" stop-opacity="0"/></radialGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24183b"/><stop offset=".48" stop-color="#171226"/><stop offset="1" stop-color="#080810"/></linearGradient>

      </g>

        <rect x="25" y="25" width="250" height="340" rx="4" fill="#120b22" stroke="#a855f7" stroke-width="7"/>

        <g fill="#67e8f9" opacity=".8"><rect class="spark" x="82" y="95" width="8" height="8"/><rect class="spark" x="178" y="73" width="6" height="6"/><rect class="spark" x="132" y="166" width="7" height="7"/><rect class="spark" x="210" y="224" width="9" height="9"/><rect class="spark" x="100" y="278" width="6" height="6"/></g>

    </svg>
  </div>
  <header class="topbar"><nav class="shell nav" aria-label="Main navigation"><a class="brand" href="/"><span class="rune" aria-hidden="true"></span><span class="brand-copy"><strong>Dark Abyss</strong><span>SMP | RPG Server</span></span></a><button class="menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button><div class="links" id="navLinks"><a href="/rules/"><span class="nav-icon">▣</span>Rules</a><a href="/commands/"><span class="nav-icon">▤</span>Guide</a><a href="#" class="coming" data-page="Store"><span class="nav-icon">▰</span>Store</a><a href="https://discord.gg/Sfk5K3jat" target="_blank" rel="noopener noreferrer"><span class="nav-icon">●</span>Discord</a></div></nav></header>

</div>
<div class="toast" id="toast"></div>
<script>
const toast=document.getElementById('toast');let toastTimer;function notify(m){if(!toast)return;clearTimeout(toastTimer);toast.textContent=m;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
const mt=document.getElementById('menuToggle'),nl=document.getElementById('navLinks');mt?.addEventListener('click',()=>nl.classList.toggle('open'));
document.querySelectorAll('.coming').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();notify((a.dataset.page||'This page')+' is coming soon')}));
async function copy(v,m){try{await navigator.clipboard.writeText(v)}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}notify(m)}
document.getElementById('javaButton').addEventListener('click',()=>copy('play.darkabyssmc.com','Java IP copied — paste it in Multiplayer'));
document.getElementById('bedrockButton').addEventListener('click',()=>copy('play.darkabyssmc.com:25565','Bedrock address copied — opening Minecraft…'));
</script>
</body>
