name: One-shot site polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-site-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polish guide, enchant descriptions and navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          def nav(active=''):
              def cls(name):
                  return ' class="active"' if active == name else ''
              return f'''<div class="links" id="navLinks">
                <a href="/rules/"{cls('rules')}><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.8-2.8 8.1-7 10-4.2-1.9-7-5.2-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>Rules</a>
                <a href="/commands/"{cls('guide')}><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21.5z"/></svg></span>Guide</a>
                <a href="/commands/enchants/"{cls('enchants')}><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg></span>Enchant List</a>
                <a href="#" class="coming" data-page="Store"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1 11H6L5 9z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/><path d="M9 13h6"/></svg></span>Store</a>
                <a href="https://discord.gg/wahrwelt" target="_blank" rel="noopener noreferrer"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 7.5A13 13 0 0 1 12 6.7a13 13 0 0 1 4.5.8c1.5 2.1 2.2 4.4 2.4 6.8-1.7 1.3-3.3 2.1-4.9 2.5l-.8-1.2"/><path d="M10.8 16.5a11 11 0 0 1-4.8.3c-1.6-.4-3.2-1.2-4.9-2.5.2-2.4.9-4.7 2.4-6.8A13 13 0 0 1 8 6.7"/><circle cx="8.7" cy="12.2" r="1"/><circle cx="15.3" cy="12.2" r="1"/></svg></span>Discord</a>
              </div>'''

          pages = {
              'index.html': '',
              'rules/index.html': 'rules',
              'commands/index.html': 'guide',
              'commands/enchants/index.html': 'enchants',
          }
          for filename, active in pages.items():
              p = Path(filename)
              html = p.read_text(encoding='utf-8')
              html, count = re.subn(r'<div class="links" id="navLinks">.*?</div>', nav(active), html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not replace navbar in {filename}')
              if '.nav-icon svg' not in html:
                  html = html.replace(
                      '.nav-icon{color:#bd7bff}',
                      '.nav-icon{width:17px;height:17px;display:inline-grid;place-items:center;color:#bd7bff;filter:drop-shadow(0 0 7px rgba(168,85,247,.28));transition:.18s}.nav-icon svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}'
                  )
              p.write_text(html, encoding='utf-8')

          guide = Path('commands/guide-updates.js')
          js = guide.read_text(encoding='utf-8')
          js = re.sub(
              r'\n\s*if \(!find\(\'Server Plugin Stack\'\)\) \{.*?\n\s*\}\n(?=\}\)\(\);)',
              '\n',
              js,
              flags=re.S,
          )
          guide.write_text(js, encoding='utf-8')

          enchants = Path('commands/enchants/index.html')
          html = enchants.read_text(encoding='utf-8')
          start = html.index('    function parseEnchant(text,path){')
          end = html.index('    async function mapLimit', start)
          replacement = r'''    function cleanDescription(text){
              let d=strip(scalar(text,'description'));
              d=d.replace(/%placeholder%\s*damage/gi,'damage that scales with enchant level')
                 .replace(/%placeholder%\s*seconds?/gi,'a duration that scales with enchant level')
                 .replace(/%placeholder%\s*blocks?/gi,'a number of blocks that scales with enchant level')
                 .replace(/%placeholder%\s*hearts?/gi,'an amount of health that scales with enchant level')
                 .replace(/%placeholder%\s*health/gi,'health that scales with enchant level')
                 .replace(/%placeholder%\s*%?\s*chance/gi,'a chance that scales with enchant level')
                 .replace(/%placeholder%/gi,'a value that scales with enchant level')
                 .replace(/%level%/gi,'the enchant level')
                 .replace(/%[^%]+%/g,'a scaled value')
                 .replace(/\s+/g,' ')
                 .replace(/\s+([,.!?])/g,'$1')
                 .trim();
              return d || 'Custom enchantment effect.';
            }
            function parseEnchant(text,path){return{id:path.replace(/\.yml$/,'').split('/').pop(),group:path.includes('/')?path.split('/')[0]:'',name:strip(scalar(text,'display-name'))||pretty(path.replace(/\.yml$/,'').split('/').pop()),description:cleanDescription(text),formula:'',type:(scalar(text,'type')||'normal').toLowerCase(),rarity:(scalar(text,'rarity')||'common').toLowerCase(),maxLevel:Number(scalar(text,'max-level')||1),targets:listField(text,'targets')}}
'''
          html = html[:start] + replacement + html[end:]
          html = re.sub(r'\$\{e\.formula\?`<div class="formula">.*?</div>`:\'\'\}', '', html)
          html = html.replace('dark-abyss-enchants-${SOURCE_COMMIT}-v1', 'dark-abyss-enchants-${SOURCE_COMMIT}-v2')
          enchants.write_text(html, encoding='utf-8')

          Path('.github/workflows/one-shot-site-polish.yml').unlink()

      - name: Commit polished site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish enchant descriptions and navigation"
          git push
